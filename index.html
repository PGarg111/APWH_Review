<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP World History Review</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <meta name="referrer" content="strict-origin-when-cross-origin">
</head>
<body>
    <div class="nav">
        <button class="nav-button" onclick="showPage('home')">Home</button>
        <button class="nav-button" onclick="showPage('units')">Units</button>
        <button class="nav-button" onclick="showPage('flashcards')">Flashcards</button>
        <button class="nav-button" onclick="showPage('examprep')">Exam Prep</button>
        <div class="nav-quote" id="nav-quote" style="margin-left: 15px;"></div>
    </div>

    <div class="hover">
        <img class="hover-img" src="up-arrow-icon-removebg-preview.png">
        <p style="margin-top: 3px;">Hover over me!!!</p>
    </div>
    

    <div class="page" id="home" style="animation: slide-in 1s ease-in-out forwards">
        <div class="title">
            <h1>AP World History Review</h1>
            <p>Everything you need to ace the exam! Breakdowns of each unit, flashcards, MCQs, LEQs, DBQs, and AI feedback on all your responses!</p>
        </div>

        <div class="section-header">
            <h2>Units</h2>
            <span class="tag"></span>
        </div>
        <div class="unit-grid" id="home-units"></div>
    </div>

    <div class="page hidden" id="units" style="animation: slide-in 1s ease-in-out forwards">
        <div class="section-header">
            <h2>All Units</h2>
            <span class="tag">Select a unit to begin</span>
        </div>
        <div class="unit-grid" id="all-units"></div>
    </div>

    <div class="page hidden" id="unit-detail" style="animation: slide-in 1s ease-in-out forwards">
        <button class="back" onclick="showPage('units')">Back to Units</button>
        <div class="section-head">
            <h2 id="unit-detail-title"></h2>
            <span class="tag" id="unit-detail-tag"></span>
        </div>

        <div class="subsection-tabs" id="subsection-tabs"></div>
        <div id="subsection-panels"></div>

        <div id="unit-videos"></div>
        <div id="unit-leq"></div>
        <div id="unit-dbq"></div>
    </div>

    <div class="page hidden" id="flashcards" style="animation: slide-in 1s ease-in-out forwards">
        <div class="section-header">
            <h2>Flashcards</h2>
            <span class="tag">Select a unit to begin reviewing key terms</span>
        </div>

        <div class="subsection-tabs" id="flashcard-unit-tabs"></div>
        <div class="flashcard-deck">
            <div class="deck">
                <button class="back arrow" onclick="changeCard(-1)">←</button>
                <div id="card-space"></div>
                <button class="back arrow" onclick="changeCard(-1)">→</button>
            </div>
            <div id="counter"></div>
        </div>
        
    </div>

    
</body>
</html>
